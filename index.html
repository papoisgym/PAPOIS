<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PAPOIS Gym</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f4;--card:#fff;--tx:#17181a;--mu:#666c75;--ac:#ffb400;--act:#111;--bd:#e3e3df;--ok:#2b8a3e;--wa:#d9730d;--er:#c92a2a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1012;--card:#1a1c1f;--tx:#f1f1ee;--mu:#9a9fa8;--bd:#2c2f34;--ok:#51cf66;--wa:#fcc419;--er:#ff6b6b}}
html{scroll-behavior:smooth;scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:inherit}.w{max-width:1040px;margin:0 auto;padding:0 18px}.ov{overflow-x:auto}
.top{position:sticky;top:0;z-index:5;background:#111;color:#fff}.top .w{display:flex;align-items:center;gap:6px;height:58px;flex-wrap:nowrap;overflow-x:auto}
.logo{font-weight:900;letter-spacing:3px;font-size:22px;color:var(--ac);margin-right:auto;cursor:pointer;white-space:nowrap}
.top a,.top button{color:#fff;background:none;border:0;font:inherit;font-size:14px;padding:8px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn{background:var(--ac)!important;color:#111!important;border-radius:999px;font-weight:700;border:0;padding:10px 18px;cursor:pointer;font:inherit;font-weight:700;text-decoration:none;display:inline-block}
.btn2{background:none;border:2px solid var(--ac);color:var(--ac);border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.hero{background:linear-gradient(120deg,rgba(0,0,0,.85),rgba(0,0,0,.45)),repeating-linear-gradient(45deg,#2a2a2a 0 14px,#222 14px 28px);background-size:cover;background-position:center;color:#fff;padding:90px 0 80px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:0 0 14px;max-width:640px}.hero h1 span{color:var(--ac)}.hero p{max-width:520px;font-size:18px;opacity:.9}
.sec{padding:56px 0}.sec h2{font-size:30px;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 26px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.ph{height:130px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:54px;margin-bottom:10px;background-size:cover;background-position:center}
.pl{position:relative}.pl.pop{border:2px solid var(--ac)}.pl .pr{font-size:34px;font-weight:900}.pl ul{padding-left:18px;color:var(--mu)}
.tag{position:absolute;top:-11px;right:14px;background:var(--ac);color:#111;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px}
.st{display:flex;gap:30px;flex-wrap:wrap;margin-top:30px}.st b{display:block;font-size:30px;color:var(--ac)}
footer{background:#111;color:#bbb;padding:30px 0;font-size:14px}
.app{padding:26px 0 60px}.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;flex:1 1 150px}
input,select,textarea{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
h3{margin:0 0 10px;font-size:18px}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit;font-size:13px;margin:1px;text-decoration:none;display:inline-block}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.t{font-weight:700}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.k div{background:var(--bg);border-radius:10px;padding:10px}.k b{display:block;font-size:22px}
#msg{min-height:22px;font-weight:700;margin:6px 0}.mb{margin-bottom:14px}.note{font-size:13px;color:var(--mu)}
.bn{background:#fff3cd;color:#664d03;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
/* Carrusel principal de PAPOIS */
.hero-carousel{position:relative;max-width:760px;margin:28px 0 20px;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 45px rgba(0,0,0,.28);background:#222}
.hero-slides{position:relative;height:clamp(210px,38vw,390px)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none}
.hero-slide.active{opacity:1;pointer-events:auto}
.hero-slide img,.hero-slide video{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.hero-slide:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.hero-slide-caption{position:absolute;z-index:1;left:22px;bottom:20px;color:#fff;font-size:clamp(16px,2.5vw,23px);font-weight:800;text-shadow:0 2px 8px #000}
.hero-carousel-control{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:27px;line-height:1;cursor:pointer}
.hero-carousel-control:hover{background:var(--ac);color:#111}
.hero-carousel-control.prev{left:12px}.hero-carousel-control.next{right:12px}
.hero-dots{position:absolute;z-index:2;right:18px;bottom:20px;display:flex;gap:8px}
.hero-dot{width:9px;height:9px;border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.6);cursor:pointer}
.hero-dot.active{background:var(--ac);transform:scale(1.25)}
@media(max-width:600px){.hero{padding:58px 0 54px}.hero-carousel{margin-top:22px}.hero-carousel-control{width:36px;height:36px}.hero-slide-caption{left:15px;bottom:17px}.hero-dots{right:15px;bottom:19px}}
</style></head><body><div id="root"></div>
<script>
var CONFIG={API_URL:'',CLAVE:'cambia-esta-clave'};
var PL={'Básico':{p:399,t:['Acceso al gimnasio','Horario 6:00 a 22:00','Reserva de salones']},'Plus':{p:599,t:['Todo lo del Básico','Clases grupales ilimitadas','Rutina personalizada','Expediente en línea']},'Premium':{p:799,t:['Todo lo del Plus','Dieta personalizada','Reserva prioritaria de equipo','1 invitado al mes']}};
var SAL=['Salón A (clases)','Salón B (funcional)','Sala de spinning'],HRS=[];for(var h=6;h<22;h++)HRS.push((h<10?'0':'')+h+':00');
var K='papois_web_v1',S=null,ses=null,tab='',M='',ND=5,Q='',estado='local',reg=false;
var $=function(i){return document.getElementById(i)};
var hoy=function(){return new Date().toISOString().slice(0,10)};
var add=function(f,d){var x=new Date(f+'T12:00:00');x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
var dias=function(f){return Math.round((new Date(f+'T12:00:00')-new Date(hoy()+'T12:00:00'))/864e5)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var sid=function(i){return S.socios.find(function(x){return x.id==i})};
var bn=function(i){var b=S.banco.find(function(x){return x.id==i});return b?b.nombre:'Sin asignar'};
function seed(){return{socios:[{id:'PAP-1001',nombre:'Ana López',email:'ana@example.com',tel:'+525500000001',pass:'1234',plan:'Plus',vence:add(hoy(),12),rut:1,die:3,prog:[{f:add(hoy(),-20),peso:68,nota:'Inicio'},{f:hoy(),peso:66.5,nota:'Buen avance'}],avisado:''},{id:'PAP-1002',nombre:'Luis Pérez',email:'luis@example.com',tel:'+525500000002',pass:'1234',plan:'Básico',vence:add(hoy(),3),rut:2,die:null,prog:[],avisado:''},{id:'PAP-1003',nombre:'María Ruiz',email:'maria@example.com',tel:'+525500000003',pass:'1234',plan:'Premium',vence:add(hoy(),-4),rut:null,die:null,prog:[],avisado:''}],
admins:[{u:'admin',pass:'admin123',nombre:'Administrador general',rol:'Administrador'},{u:'recepcion',pass:'recep123',nombre:'Recepción',rol:'Recepción'}],
pagos:[{folio:'F-0001',fecha:hoy(),socio:'PAP-1001',plan:'Plus',monto:599}],asist:[],egresos:[{fecha:hoy(),concepto:'Mantenimiento bicicleta',monto:300}],
reservas:[{id:1,socio:'PAP-1001',nombre:'Ana López',tipo:'Salón',recurso:SAL[0],fecha:add(hoy(),1),hora:'18:00',est:'Activa'}],
equipo:[{id:1,nombre:'Caminadora 1',est:'Operativo',costo:12000},{id:2,nombre:'Bicicleta 2',est:'En mantenimiento',costo:6000},{id:3,nombre:'Press de banca',est:'Operativo',costo:5000},{id:4,nombre:'Rack de sentadilla',est:'Operativo',costo:15000}],
banco:[{id:1,tipo:'Rutina',nombre:'Fuerza básica',desc:'3 días: pecho/espalda, pierna, hombro/brazo'},{id:2,tipo:'Rutina',nombre:'Cardio y resistencia',desc:'4 días: caminadora, bicicleta, circuito'},{id:3,tipo:'Dieta',nombre:'Mantenimiento',desc:'5 comidas al día con proteína en cada una'}],
emp:[{id:1,nombre:'Carlos Ramírez',puesto:'Instructor',sueldo:9000},{id:2,nombre:'Sofía Torres',puesto:'Recepcionista',sueldo:8000}]}}
function ensure(){var d=seed();Object.keys(d).forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});if(!S.admins.length)S.admins=d.admins}
function post(o){o.clave=CONFIG.CLAVE;return fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).then(function(r){return r.json()})}
function cargar(){var fin=function(){if(!S||!S.socios){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}}if(!S||!S.socios)S=seed();ensure();render()};
 if(CONFIG.API_URL)post({accion:'load'}).then(function(j){if(j&&j.socios){S=j;estado='nube'}else estado='error';fin()}).catch(function(){estado='error';fin()});else fin()}
var tm;function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(CONFIG.API_URL&&estado=='nube'){clearTimeout(tm);tm=setTimeout(function(){post({accion:'save',datos:S}).catch(function(){})},700)}}
function ir(id){if(location.hash&&location.hash!='#/'){location.hash='#/';setTimeout(function(){var e=$(id);if(e)e.scrollIntoView()},60)}else{var e=$(id);if(e)e.scrollIntoView()}}
function nav(){return'<div class="top"><div class="w"><span class="logo" onclick="location.hash=\'#/\'">PAPOIS</span><button onclick="ir(\'quienes\')">Nosotros</button><button onclick="ir(\'inst\')">Instalaciones</button><button onclick="ir(\'planes\')">Planes</button><button onclick="ir(\'contacto\')">Contacto</button><a href="#/socio" class="btn">Acceso socios</a><a href="#/admin">Administración</a></div></div>'}
function foot(){return'<footer><div class="w">PAPOIS Gym · Proyecto escolar, datos e imágenes ilustrativos · '+(estado=='nube'?'Datos en Google Sheets':estado=='error'?'Sin conexión con la base de datos: modo local':'Modo demostración: datos solo en este navegador')+'</div></footer>'}
var IMG={pesas:'🏋️',cardio:'🏃',clases:'🧘',spin:'🚴',func:'🤸',lock:'🚿'};
function home(){var pl=Object.keys(PL).map(function(k,i){return'<div class="c pl'+(i==1?' pop':'')+'">'+(i==1?'<span class="tag">MÁS POPULAR</span>':'')+'<h3>'+k+'</h3><div class="pr">$'+PL[k].p+'<small style="font-size:14px;font-weight:400">/mes</small></div><ul>'+PL[k].t.map(function(t){return'<li>'+t+'</li>'}).join('')+'</ul><a class="btn" href="#/socio" onclick="reg=true;PS=\''+k+'\'">Inscríbete</a></div>'}).join('');
 var ins=[['pesas','Zona de pesas','Peso libre, máquinas y racks'],['cardio','Cardio','Caminadoras, elípticas y bicicletas'],['clases','Clases grupales','Yoga, baile y acondicionamiento'],['spin','Sala de spinning','Clases con instructor'],['func','Área funcional','Entrenamiento por circuitos'],['lock','Vestidores','Regaderas y lockers']].map(function(x){return'<div class="c"><div class="ph" style="background-color:#2b2b2b;background-image:url(img/'+x[0]+'.jpg)">'+IMG[x[0]]+'</div><b>'+x[1]+'</b><div class="note">'+x[2]+'</div></div>'}).join('');
 return nav()+'<div class="hero" style="background-image:linear-gradient(120deg,rgba(0,0,0,.85),rgba(0,0,0,.4)),url(img/hero.jpg)"><div class="w"><h1>Entrena a tu ritmo en <span>PAPOIS</span></h1><div class="hero-carousel" id="papoisCarousel" aria-label="Galería de PAPOIS"><div class="hero-slides"><div class="hero-slide active"><img src="WhatsApp%20Image%202026-10-13%20at%2011.33.21%20PM.jpeg" alt="Fotografía de PAPOIS Gym"><div class="hero-slide-caption">Tu espacio, tu ritmo</div></div><div class="hero-slide"><video src="WhatsApp%20Video%202026-10-13%20at%2011.33.21%20PM%20(1).mp4" muted playsinline loop preload="metadata" aria-label="Video de PAPOIS Gym"></video><div class="hero-slide-caption">Fuerza para tus metas</div></div><div class="hero-slide"><video src="WhatsApp%20Video%202026-10-13%20at%2011.33.21%20PM.mp4" muted playsinline loop preload="metadata" aria-label="Video de entrenamiento PAPOIS"></video><div class="hero-slide-caption">Supera tus límites</div></div></div><button class="hero-carousel-control prev" type="button" aria-label="Imagen anterior" onclick="papoisMoveSlide(-1)">‹</button><button class="hero-carousel-control next" type="button" aria-label="Imagen siguiente" onclick="papoisMoveSlide(1)">›</button><div class="hero-dots" aria-label="Seleccionar imagen"><button class="hero-dot active" type="button" aria-label="Mostrar imagen 1" onclick="papoisShowSlide(0)"></button><button class="hero-dot" type="button" aria-label="Mostrar imagen 2" onclick="papoisShowSlide(1)"></button><button class="hero-dot" type="button" aria-label="Mostrar imagen 3" onclick="papoisShowSlide(2)"></button></div></div></div><p>Gimnasio en la zona metropolitana de la CDMX. Reserva salones y equipo, consulta tu rutina y renueva tu membresía desde internet.</p><a class="btn" href="#/socio" onclick="reg=true">Inscríbete hoy</a> <a class="btn2" href="#/socio" onclick="reg=false">Ya soy socio</a><div class="st"><div><b>6</b>áreas de entrenamiento</div><div><b>3</b>planes</div><div><b>6 a 22 h</b>todos los días</div></div></div></div>'+
 '<div class="sec" id="quienes"><div class="w"><h2>Quiénes somos</h2><p class="sub">PAPOIS es un gimnasio pensado para que entrenar sea simple: sin filas, sin papeles y sin sorpresas con tu membresía.</p><div class="g"><div class="c"><b>Control de pagos y asistencia</b><div class="note">Entra con tu credencial y tu historial queda registrado.</div></div><div class="c"><b>Avisos de vencimiento</b><div class="note">Te avisamos por correo o SMS antes de que termine tu membresía.</div></div><div class="c"><b>Tu expediente en línea</b><div class="note">Consulta tu rutina, dieta y avance físico desde cualquier lugar.</div></div></div></div></div>'+
 '<div class="sec" id="inst" style="background:var(--card)"><div class="w"><h2>Instalaciones</h2><p class="sub">Todo lo que necesitas en un solo lugar.</p><div class="g">'+ins+'</div></div></div>'+
 '<div class="sec" id="planes"><div class="w"><h2>Planes</h2><p class="sub">Sin plazos forzosos. Precios ilustrativos.</p><div class="g">'+pl+'</div></div></div>'+
 '<div class="sec" id="contacto" style="background:var(--card)"><div class="w"><h2>Contacto</h2><p class="sub">Av. Ejemplo 123, CDMX (dirección ilustrativa)<br>Tel. 55 0000 0000 · contacto@papois.example<br>Lunes a domingo, 6:00 a 22:00</p></div></div>'+foot()}
var PS='Plus';
function msgb(){return'<div id="msg">'+esc(M)+'</div>'}
function tbl(h,r){return'<div class="ov"><table><tr>'+h.map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>'+(r.length?r.join(''):'<tr><td colspan="'+h.length+'" class="note">Sin registros</td></tr>')+'</table></div>'}
function est(s){var d=dias(s.vence);return d<0?['Vencida','er']:d<=5?['Por vencer ('+d+' d)','wa']:['Vigente','ok']}
var opt=function(a,sel){return a.map(function(o){o=[].concat(o);var v=o[0],l=o.length>1?o[1]:o[0];return'<option value="'+esc(v)+'"'+(v==sel?' selected':'')+'>'+esc(l)+'</option>'}).join('')};
function folio(){return'F-'+String(S.pagos.length+1).padStart(4,'0')}
function cobrar(s,plan){s.plan=plan;var b=dias(s.vence)>0?s.vence:hoy();s.vence=add(b,30);s.avisado='';S.pagos.push({folio:folio(),fecha:hoy(),socio:s.id,plan:plan,monto:PL[plan].p});return PL[plan].p}
function newId(){return'PAP-'+(S.socios.reduce(function(a,x){return Math.max(a,+String(x.id).slice(4)||0)},1000)+1)}
function descargar(n,t){t='\ufeff'+t;var go=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()};
 if(window.claude&&claude.use)claude.use('downloads').then(function(d){if(d)d.save({filename:n,data:t});else go()}).catch(go);else go()}
function csv(k){var rows=S[k].map(function(o){var c={};Object.keys(o).forEach(function(x){if(x!='pass')c[x]=typeof o[x]=='object'&&o[x]?JSON.stringify(o[x]):o[x]});return c});if(!rows.length){M='No hay datos en '+k;render();return}
 var cols=[];rows.forEach(function(r){Object.keys(r).forEach(function(c){if(cols.indexOf(c)<0)cols.push(c)})});
 descargar('papois_'+k+'.csv',[cols.join(',')].concat(rows.map(function(r){return cols.map(function(c){return'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"'}).join(',')})).join('\r\n'))}
/* ---------- socio ---------- */
function loginSocio(e){e.preventDefault();var f=e.target.elements,u=f.u.value.trim().toLowerCase(),s=S.socios.find(function(x){return String(x.id).toLowerCase()==u||String(x.email).toLowerCase()==u});
 if(!s||s.pass!==f.p.value){M='ID/correo o contraseña incorrectos';render();return}ses={t:'socio',id:s.id};tab='mem';M='';render()}
function regSocio(e){e.preventDefault();var f=e.target.elements;
 if(S.socios.some(function(x){return String(x.email).toLowerCase()==f.email.value.trim().toLowerCase()})){M='Ese correo ya está registrado';render();return}
 if(f.p.value.length<4){M='La contraseña debe tener al menos 4 caracteres';render();return}
 var s={id:newId(),nombre:f.nombre.value.trim(),email:f.email.value.trim(),tel:f.tel.value.trim(),pass:f.p.value,plan:f.plan.value,vence:hoy(),rut:null,die:null,prog:[],avisado:''};S.socios.push(s);cobrar(s,s.plan);save();ses={t:'socio',id:s.id};tab='mem';M='Registro listo. Tu ID de socio es '+s.id+'. Pago simulado.';render()}
function renovarMi(e){e.preventDefault();var s=sid(ses.id);M='Renovación pagada (simulada): $'+cobrar(s,e.target.elements.plan.value)+'. Vence '+s.vence;save();render()}
function datosMi(e){e.preventDefault();var f=e.target.elements,s=sid(ses.id);s.email=f.email.value.trim();s.tel=f.tel.value.trim();M='Datos de contacto guardados';save();render()}
function reservar(e){e.preventDefault();var f=e.target.elements,s=sid(ses.id),rec=f.rec.value,fe=f.fecha.value,ho=f.hora.value;
 if(dias(s.vence)<0){M='Tu membresía está vencida. Renuévala para reservar.';render();return}
 if(fe<hoy()){M='Elige una fecha de hoy en adelante';render();return}
 if(S.reservas.some(function(x){return x.est=='Activa'&&x.recurso==rec&&x.fecha==fe&&x.hora==ho})){M='Ese horario ya está ocupado, elige otro';render();return}
 S.reservas.push({id:Date.now(),socio:s.id,nombre:s.nombre,tipo:SAL.indexOf(rec)>=0?'Salón':'Equipo',recurso:rec,fecha:fe,hora:ho,est:'Activa'});M='Reservación confirmada';save();render()}
function cancelar(id){S.reservas.find(function(x){return x.id==id}).est='Cancelada';M='Reservación cancelada: el espacio queda libre';save();render()}
function recursos(){return SAL.concat(S.equipo.filter(function(q){return q.est=='Operativo'}).map(function(q){return q.nombre}))}
function socioView(){var body='';

/* Controles del carrusel principal */
var papoisCurrentSlide=0,papoisCarouselTimer=null;
function papoisShowSlide(index){
 var root=$('papoisCarousel');if(!root)return;
 var slides=root.querySelectorAll('.hero-slide'),dots=root.querySelectorAll('.hero-dot');
 if(!slides.length)return;
 papoisCurrentSlide=(index+slides.length)%slides.length;
 slides.forEach(function(s,i){
  var active=i===papoisCurrentSlide;
  s.classList.toggle('active',active);
  var v=s.querySelector('video');
  if(v){
   if(active){var playPromise=v.play();if(playPromise&&playPromise.catch)playPromise.catch(function(){});}
   else{v.pause();try{v.currentTime=0}catch(e){}}
  }
 });
 dots.forEach(function(d,i){d.classList.toggle('active',i===papoisCurrentSlide);d.setAttribute('aria-pressed',i===papoisCurrentSlide?'true':'false')});
}
function papoisMoveSlide(step){papoisShowSlide(papoisCurrentSlide+step);papoisStartCarousel()}
function papoisStartCarousel(){
 if(papoisCarouselTimer)clearInterval(papoisCarouselTimer);
 papoisCarouselTimer=setInterval(function(){papoisShowSlide(papoisCurrentSlide+1)},5000);
}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(papoisCarouselTimer)clearInterval(papoisCarouselTimer)}
 else papoisStartCarousel();
});
cargar();
papoisStartCarousel();
